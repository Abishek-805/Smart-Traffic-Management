version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: smart-traffic-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app-backend:
    build:
      context: .
      dockerfile: app-backend/Dockerfile
    container_name: smart-traffic-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379
      - DEBUG=true
      - CAMERA_PUBLIC_HOST=${CAMERA_PUBLIC_HOST:-localhost}
      - CAMERA_WS_PORT=8001
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  websocket-server:
    build:
      context: .
      dockerfile: websocket-server/Dockerfile
    container_name: smart-traffic-ws-server
    ports:
      - "8001:8001"
    environment:
      - OMP_WAIT_POLICY=PASSIVE
      - KMP_BLOCKTIME=0
      - YOLO_CPU_THREADS=4
      - YOLO_INPUT_SIZE=640
      - YOLO_MAX_DETECTIONS=100
      - PORT=8001
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    container_name: smart-traffic-web-ui
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=/api/v1
      - VITE_WS_URL=/ws/telemetry
      - VITE_BACKEND_TARGET=http://app-backend:8000
      - VITE_WS_TARGET=ws://websocket-server:8001
    depends_on:
      - app-backend
      - websocket-server
    restart: unless-stopped
